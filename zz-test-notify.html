<!doctype html><meta charset="utf-8"><title>notify test</title>
<button id="a">A no-cors form</button> <button id="b">B cors json</button>
<form id="c" method="post" target="_self"><input type="hidden" name="payload_json" id="cp"><button>C form post</button></form>
<pre id="out"></pre>
<script>
var W="https://discord.com/api/webhooks/1571869894146920569/kpA5ymgnwaeKYdvq91v_ggCy6qWE1ze6zwcJYvGWdYft2Zq5hFOyH1BXUDE83a0T5jDq";
var out=document.getElementById("out"); function log(t){out.textContent+=t+"\n";}
function payload(tag){return JSON.stringify({username:"พู่กัน หลังบ้าน",embeds:[{title:"ทดสอบ "+tag,description:"จาก Claude",color:0x2b3bd1,timestamp:new Date().toISOString()}],allowed_mentions:{parse:[]}});}
document.getElementById("a").onclick=function(){var f=new FormData();f.append("payload_json",payload("A"));fetch(W,{method:"POST",body:f,mode:"no-cors",keepalive:true}).then(function(r){log("A sent, type="+r.type+" status="+r.status)},function(e){log("A error "+e)});};
document.getElementById("b").onclick=function(){fetch(W+"?wait=true",{method:"POST",headers:{"Content-Type":"application/json"},body:payload("B")}).then(function(r){return r.text().then(function(t){log("B status="+r.status+" "+t.slice(0,200))})},function(e){log("B error "+e)});};
document.getElementById("cp").value=payload("C"); document.getElementById("c").action=W+"?wait=true";
</script>
