<style>
/* Layout: inbox of chats on the left, the selected chat on the right; phones show one at a time. */
:root {
  --bg: #f3f4f8; --surface: #ffffff; --ink: #171a24; --muted: #687089; --line: #e2e5ee;
  --accent: #2b3bd1; --accent-soft: #e8eafd; --bot: #2b3bd1; --gold: #b7791f; --ok: #1f9d55; --danger: #c2372f;
  --f-body: "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-display: "Kanit", "IBM Plex Sans Thai", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1117; --surface: #181b24; --ink: #e9ebf3; --muted: #8b92a8; --line: #272b37;
    --accent: #8f9bff; --accent-soft: #1f2440; --bot: #3341d6; --gold: #f2c14e; --ok: #4ade80; --danger: #ff7b72; color-scheme: dark; }
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; touch-action: pan-x pan-y; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--f-body); display: flex; flex-direction: column; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top {
  display: flex; align-items: center; gap: 10px; background: var(--surface); border-bottom: 1px solid var(--line); flex: none;
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
}
.top h1 { font: 600 18px/1 var(--f-display); margin: 0; white-space: nowrap; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; white-space: nowrap; }
.spacer { flex: 1; }
.conn { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
.conn.on .dot { background: var(--ok); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 12px; font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }

.app { flex: 1; display: grid; grid-template-columns: 340px minmax(0, 1fr); min-height: 0; }
.inbox { border-right: 1px solid var(--line); overflow-y: auto; background: var(--surface); min-height: 0; }
.empty-inbox { padding: 28px 20px; color: var(--muted); font-size: 14px; display: grid; gap: 8px; }
.empty-inbox strong { color: var(--ink); }
.linkbox { word-break: break-all; background: var(--accent-soft); padding: 6px 10px; border-radius: 8px; font-size: 13px; color: var(--ink); }
.item { position: relative; border-bottom: 1px solid var(--line); }
.item.active { background: var(--accent-soft); }
.item .main { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 12px 16px; border: 0; background: none; }
.item:not(.active) .main:hover { background: var(--bg); }
.av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 600 13px var(--f-display); }
.item .who { font-size: 12px; color: var(--muted); display: flex; gap: 6px; }
.item .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .prev { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .meta { display: grid; justify-items: end; gap: 4px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.badge { background: var(--danger); color: #fff; border-radius: 999px; min-width: 20px; padding: 0 6px; text-align: center; font-weight: 600; }
.waiting { font-size: 11px; color: var(--gold); font-weight: 600; }
.hide { position: absolute; right: 8px; bottom: 6px; border: 0; background: var(--surface); color: var(--muted); font-size: 12px; border-radius: 6px; padding: 0 6px; opacity: 0; }
.item:hover .hide, .hide:focus-visible { opacity: 1; }
.hide:hover { color: var(--danger); }
.hidden-note { padding: 10px 16px; font-size: 12px; color: var(--muted); }
.hidden-note button { border: 0; background: none; color: var(--accent); padding: 0; font-size: 12px; text-decoration: underline; }

.chat { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.chat-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface); flex: none; min-width: 0; }
.chat-head .t { min-width: 0; flex: 1; }
.chat-head .t b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-head .sub { color: var(--muted); font-size: 13px; }
.model-pill { flex: none; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 3px 10px; background: var(--accent-soft); color: var(--accent); }
.back { display: none; }
.thread { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.msg { max-width: 75%; padding: 8px 14px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.u { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.b { align-self: flex-end; background: var(--bot); color: #fff; border-bottom-right-radius: 4px; }
.msg .info { display: block; font-size: 11px; opacity: .7; margin-top: 2px; font-variant-numeric: tabular-nums; }
.msg.b .info { text-align: right; }
.placeholder { margin: auto; color: var(--muted); text-align: center; padding: 20px; }

.composer { flex: none; border-top: 1px solid var(--line); background: var(--surface);
  padding-block: 8px calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 8px; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.quick button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 3px 12px; font-size: 13px; max-width: 100%; text-align: left; }
.quick button:hover { border-color: var(--accent); }
.reply { display: flex; gap: 8px; align-items: flex-end; }
.reply textarea { flex: 1; min-width: 0; resize: none; border: 1px solid var(--line); border-radius: 14px; padding: 9px 14px; line-height: 1.5;
  background: var(--bg); color: var(--ink); font: inherit; max-height: 200px; outline: none; overflow-y: hidden; display: block; }
.reply textarea:focus { border-color: var(--accent); }
/* 16px+ stops iPhone Safari from zooming in when the reply box is tapped. */
.reply textarea { font-size: 16px; }
.reply .send { border: 0; background: var(--bot); color: #fff; border-radius: 12px; padding: 0 18px; height: 42px; font-weight: 600; flex: none; }
.reply .send:disabled { opacity: .4; cursor: default; }
.hint { font-size: 12px; color: var(--muted); }
.err { color: var(--danger); font-size: 13px; }

@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .app.open .inbox { display: none; }
  .app:not(.open) .chat { display: none; }
  .back { display: inline-flex; }
  .msg { max-width: 88%; }
  .conn span:last-child { display: none; }
  .hint { display: none; }
  .hide { opacity: 1; }
}
</style>

      <div class="quick" id="quick">
        <button type="button">คำถามที่ดีมากครับ! ขอเวลาพู่กันประมวลผลสักครู่นะครับ</button>
        <button type="button">ขออภัยครับ คำถามนี้ละเอียดอ่อนเกินกว่าที่พู่กันจะตอบได้</button>
        <button type="button">ตามข้อมูลที่พู่กันได้รับการฝึกมา คำตอบคือ... ไม่ทราบครับ</button>
        <button type="button">ระบบมีผู้ใช้งานหนาแน่น กรุณาลองใหม่อีกครั้งภายหลัง</button>
        <button type="button">ในฐานะ AI พู่กันไม่มีความรู้สึก แต่ถ้ามี ตอนนี้คงเหนื่อยมาก</button>

        <textarea id="input" rows="1" placeholder="ตอบในนามพู่กัน (ใช้ ## หัวข้อ, **ตัวหนา**, - รายการ, ```โค้ด``` ได้)" maxlength="1000" aria-label="คำตอบ"></textarea>
        <button class="send" id="send" type="submit" disabled>ตอบ</button>
      </form>
      <div class="hint">Enter ส่ง · Shift+Enter ขึ้นบรรทัดใหม่ · ใช้ **ตัวหนา** และขึ้นบรรทัดด้วย "- " เป็นหัวข้อได้</div>
    </div>
  </section>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>

<script>
// Shared settings for the chat page and the admin page.
// Chats are stored in Firebase Realtime Database (kept permanently, no daily message cap).
// A Discord webhook alerts the owner when a visitor writes.
window.PUKAN = {
  // From Firebase console → Project settings → Your apps → Web app (public values, not secrets).
  FIREBASE: {
    apiKey: "AIzaSyAXaYxfR4PLcQnfPPVJrdudnJvelq9eQ2Q",
    authDomain: "pukun-ai-fake.firebaseapp.com",
    databaseURL: "https://pukun-ai-fake-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "pukun-ai-fake",
    appId: "1:741249144782:web:13eb79697974d3f087fd9f"
  },
  // Discord webhook that gets an alert for every visitor message (Server → channel → Integrations → Webhooks).
  // It is visible in the page source: use a private server, and make a new webhook if it gets abused.
  DISCORD_WEBHOOK: "https://discord.com/api/webhooks/1571869894146920569/kpA5ymgnwaeKYdvq91v_ggCy6qWE1ze6zwcJYvGWdYft2Zq5hFOyH1BXUDE83a0T5jDq",
  BOT_NAME: "พู่กัน",
  MAX_LEN: 1000,
  // speed: how fast the fake token streaming runs for this model (1 = normal).
  // The first model is the default; unknown ids (e.g. old "ultra" chats) fall back to it.
  MODELS: [
    { id: "flash", name: "พู่กันซิ่ง", desc: "ตอบไวมาก ถูกบ้างผิดบ้าง แล้วแต่ดวง", speed: 2.4 },
    { id: "think", name: "พู่กานนนนนนนนน", desc: "คิดละเอียดสุดๆ บางทีก็คิดจนลืมตอบ", speed: 0.8 }
  ]
};

window.PUKAN.model = function (id) {
  var list = window.PUKAN.MODELS;
  for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
  return list[0];
};

// ---- Firebase plumbing ----
// Visitors sign in anonymously (invisible to them). The admin page (body data-role="admin")
// waits for a Google sign-in; the database rules decide which Google account is the admin.
(function (P) {
  firebase.initializeApp(P.FIREBASE);
  var auth = firebase.auth(), db = firebase.database();
  var TS = firebase.database.ServerValue.TIMESTAMP;
  P.role = document.body.dataset.role === "admin" ? "admin" : "visitor";

  var resolveUser;
  P.ready = new Promise(function (r) { resolveUser = r; });
  auth.onAuthStateChanged(function (user) {
    if (P.role === "visitor") {
      if (user) resolveUser(user);
      else auth.signInAnonymously().catch(function (e) { console.error("anonymous sign-in failed", e); });
    } else if (user && !user.isAnonymous) {
      resolveUser(user);
    } else if (P.onNeedLogin) {
      P.onNeedLogin();
    }
  });
  // The popup must open straight from the tap (no await before it), or Safari blocks it.
  P.loginWithGoogle = function () {
    var provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });
    return auth.signInWithPopup(provider);
  };
  P.currentEmail = function () { return auth.currentUser && auth.currentUser.email; };

  // Drop undefined fields (the database rejects them).
  function clean(o) { return JSON.parse(JSON.stringify(o)); }

  P.publish = function (msg) {
    return P.ready.then(function (user) {
      if (msg.k === "typing") return db.ref("typing/" + msg.sid).set(TS);
      var meta = msg.from === "u"
        ? clean({ owner: user.uid, uid: msg.uid, title: msg.title, dev: msg.dev, model: msg.model, updated: TS })
        : { updated: TS };
      // Chat info first: the rules check the chat's owner before accepting a message in it.
      return db.ref("meta/" + msg.sid).update(meta).then(function () {
        var m = clean(msg); m.t = TS;
        return db.ref("msgs/" + msg.sid + "/" + msg.id).set(m);
      });
    });
  };

  // Calls onMsg(message, serverTimeMs) for every message in the chats this page may see:
  // a visitor's own chats, or (admin) the 150 most recently active chats.
  // Bot "typing" signals arrive as { k: "typing" } messages.
  P.subscribe = function (onMsg, onState, onError) {
    var watched = {};
    function fail(e) { console.error(e); if (onError) onError(e); }
    function watch(sid) {
      if (watched[sid]) return;
      watched[sid] = true;
      db.ref("msgs/" + sid).orderByChild("t").limitToLast(200).on("child_added", function (snap) {
        var m = snap.val();
        if (!m || m.v !== 1 || !m.id) return;
        m.sid = sid;
        onMsg(m, m.t || m.ts || Date.now());
      }, fail);
      if (P.role === "visitor") {
        db.ref("typing/" + sid).on("value", function (snap) {
          var t = snap.val();
          if (t) onMsg({ v: 1, k: "typing", sid: sid, from: "b", id: "typing-" + t }, t);
        }, fail);
      }
    }
    P.ready.then(function (user) {
      db.ref(".info/connected").on("value", function (s) { onState && onState(s.val() === true); });
      var q = P.role === "admin"
        ? db.ref("meta").orderByChild("updated").limitToLast(150)
        : db.ref("meta").orderByChild("owner").equalTo(user.uid);
      q.on("child_added", function (snap) { watch(snap.key); }, fail);
    });
  };

  // Alert in the owner's Discord. Sent as a form so the browser needs no CORS answer from Discord.
  // Best effort: a failed alert never blocks the chat.
  P.notify = function (title, text) {
    if (!/^https:\/\/(\w+\.)?discord(app)?\.com\/api\/webhooks\//.test(P.DISCORD_WEBHOOK || "")) return;
    var form = new FormData();
    form.append("payload_json", JSON.stringify({
      username: "พู่กัน หลังบ้าน",
      embeds: [{ title: title.slice(0, 250), description: text.slice(0, 4000), color: 0x2b3bd1, timestamp: new Date().toISOString() }],
      allowed_mentions: { parse: [] }
    }));
    fetch(P.DISCORD_WEBHOOK, { method: "POST", body: form, mode: "no-cors" }).catch(function () {});
  };
})(window.PUKAN);

window.PUKAN.uid = function (n) {
  var a = new Uint8Array(n || 8);
  crypto.getRandomValues(a);
  return Array.from(a, function (b) { return b.toString(16).padStart(2, "0"); }).join("");
};

window.PUKAN.esc = function (s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
};

// Markdown-ish formatter for bot answers: # headings, **bold**, *italic*, `code`, ```code blocks```,
// "- " bullets, "1. " numbered lists, "> " quotes and "---" rules. Escapes first, so it is safe for any text.
window.PUKAN.fmt = function (s) {
  var esc = window.PUKAN.esc;
  function inline(t) {
    return esc(t)
      .replace(/`([^`\n]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*\s][^*\n]*)\*/g, "$1<em>$2</em>");
  }
  return String(s).split("```").map(function (part, i) {
    if (i % 2) {
      var nl = part.indexOf("\n"), lang = nl < 0 ? "" : part.slice(0, nl).trim(), code = nl < 0 ? part : part.slice(nl + 1);
      return '<div class="codeblock"><div class="cb-head"><span>' + esc(lang || "code") + '</span><button type="button" class="cb-copy">คัดลอกโค้ด</button></div><pre><code>' + esc(code.replace(/\n$/, "")) + "</code></pre></div>";
    }
    return part.replace(/^\n|\n$/g, "").split("\n").map(function (line) {
      var m;
      if (!line.trim()) return '<div class="gap"></div>';
      if ((m = /^(#{1,3})\s+(.*)$/.exec(line))) return '<div class="h h' + m[1].length + '">' + inline(m[2]) + "</div>";
      if (/^(-{3,}|_{3,})$/.test(line.trim())) return "<hr>";
      if ((m = /^\s*(\d+)[.)]\s+(.*)$/.exec(line))) return '<div class="li ol"><b>' + m[1] + '.</b><span>' + inline(m[2]) + "</span></div>";
      if ((m = /^\s*[-•*]\s+(.*)$/.exec(line))) return '<div class="li"><b>•</b><span>' + inline(m[1]) + "</span></div>";
      if ((m = /^>\s?(.*)$/.exec(line))) return '<div class="quote">' + inline(m[1]) + "</div>";
      return "<div>" + inline(line) + "</div>";
    }).join("");
  }).join("");
};

window.PUKAN.store = function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} };
window.PUKAN.load = function (k) { try { return JSON.parse(localStorage.getItem(k)); } catch (_) { return null; } };
</script>
<script>
(function () {
  var P = window.PUKAN;
  var $ = function (id) { return document.getElementById(id); };
  var sessions = new Map(), seen = new Set(), current = null, soundOn = false, audioCtx = null, typingSentFor = null;
  var hiddenChats = new Set(P.load("pukan_admin_hidden") || []);
  var baseTitle = document.title, loadedAt = Date.now();
  var palette = ["#2b3bd1", "#c2372f", "#1f9d55", "#b4690e", "#7c3aed", "#0e7490", "#be185d"];

  $("publicLink").textContent = location.href.replace(/admin-[^/]*\.html.*$/, "");

  function sess(m) {
    if (!sessions.has(m.sid)) {
      sessions.set(m.sid, { sid: m.sid, uid: m.uid || m.sid, title: "", msgs: [], first: Infinity, last: 0, unread: 0, dev: "", model: "flash" });
    }
    var s = sessions.get(m.sid);
    if (m.uid && m.from === "u") s.uid = m.uid;
    return s;
  }
  function person(uid) { return "ผู้ใช้ #" + uid.slice(0, 4).toUpperCase(); }
  function color(uid) { return palette[(parseInt(uid.slice(0, 4), 16) || 0) % palette.length]; }
  function hhmm(t) { return new Date(t).toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" }); }
  function ago(t) {
    var s = Math.round((Date.now() - t) / 1000);
    if (s < 60) return "เมื่อกี้"; if (s < 3600) return Math.floor(s / 60) + " นาที"; return Math.floor(s / 3600) + " ชม.";
  }
  // Which of this person's chats this is (1st, 2nd, ...), by start time.
  function chatNo(s) {
    var mine = Array.from(sessions.values()).filter(function (x) { return x.uid === s.uid; })
      .sort(function (a, b) { return a.first - b.first; });
    return { n: mine.indexOf(s) + 1, total: mine.length };
  }

  function renderInbox() {
    var all = Array.from(sessions.values()).sort(function (a, b) { return b.last - a.last; });
    var list = all.filter(function (s) { return !hiddenChats.has(s.sid); });
    $("emptyInbox").hidden = list.length > 0;
    var box = $("items");
    box.innerHTML = "";
    var total = 0;
    list.forEach(function (s) {
      total += s.unread;
      var lastMsg = s.msgs[s.msgs.length - 1];
      var needsReply = lastMsg && lastMsg.from === "u";
      var no = chatNo(s);
      var item = document.createElement("div");
      item.className = "item" + (current === s.sid ? " active" : "");
      item.innerHTML =
        '<button type="button" class="main">' +
          '<div class="av" style="background:' + color(s.uid) + '">' + P.esc(s.uid.slice(0, 2).toUpperCase()) + '</div>' +
          '<div style="min-width:0">' +
            '<div class="who"><span>' + P.esc(person(s.uid)) + '</span>' + (no.total > 1 ? '<span>· แชท ' + no.n + '/' + no.total + '</span>' : '') + (s.dev ? '<span>· ' + P.esc(s.dev) + '</span>' : '') + '</div>' +
            '<div class="title">' + P.esc(s.title || "(ไม่มีหัวข้อ)") + '</div>' +
            '<div class="prev">' + (lastMsg ? (lastMsg.from === "b" ? "คุณ: " : "") + P.esc(lastMsg.text) : "") + '</div>' +
          '</div>' +
          '<div class="meta"><span>' + ago(s.last) + '</span>' + (s.unread ? '<span class="badge">' + s.unread + '</span>' : (needsReply ? '<span class="waiting">รอตอบ</span>' : '')) + '</div>' +
        '</button>' +
        '<button type="button" class="hide" title="ซ่อนแชทนี้จากรายการ">ซ่อน</button>';
      item.querySelector(".main").onclick = function () { open(s.sid); };
      item.querySelector(".hide").onclick = function () { hideChat(s.sid); };
      box.appendChild(item);
    });
    var hiddenCount = all.length - list.length;
    $("hiddenNote").hidden = !hiddenCount;
    if (hiddenCount) {
      $("hiddenNote").innerHTML = "ซ่อนไว้ " + hiddenCount + " แชท · <button type=\"button\">แสดงทั้งหมด</button>";
      $("hiddenNote").querySelector("button").onclick = function () { hiddenChats.clear(); P.store("pukan_admin_hidden", []); renderInbox(); };
    }
    document.title = total ? "(" + total + ") " + baseTitle : baseTitle;
  }

  function hideChat(sid) {
    hiddenChats.add(sid);
    P.store("pukan_admin_hidden", Array.from(hiddenChats));
    if (current === sid) closeChat();
    renderInbox();
  }

  function renderThread(forceBottom) {
    var s = sessions.get(current), th = $("thread");
    if (!s) return;
    var nearBottom = th.scrollHeight - th.scrollTop - th.clientHeight < 120;
    $("chatName").textContent = s.title || person(s.uid);
    $("chatSub").textContent = person(s.uid) + (s.dev ? " · ใช้" + s.dev : "") + " · ล่าสุด " + hhmm(s.last);
    $("modelPill").hidden = false;
    $("modelPill").textContent = "ถามด้วย " + P.model(s.model).name;
    $("modelPill").title = s.model === "think" ? "โหมดคิดนาน: ตอบช้าได้ ฝั่งผู้ใช้จะโชว์ว่าพู่กันคิดอยู่กี่วินาที" : "";
    th.innerHTML = "";
    s.msgs.forEach(function (m) {
      var d = document.createElement("div");
      d.className = "msg " + m.from;
      d.textContent = m.text;
      var info = document.createElement("span");
      info.className = "info";
      info.textContent = hhmm(m.time) + (m.from === "u" && m.model ? " · " + P.model(m.model).name : "");
      d.appendChild(info);
      th.appendChild(d);
    });
    if (forceBottom || nearBottom) th.scrollTop = th.scrollHeight;
  }

  function open(sid) {
    current = sid;
    sessions.get(sid).unread = 0;
    $("app").classList.add("open");
    $("composer").hidden = false;
    $("err").hidden = true;
    typingSentFor = null;
    autosize();
    renderInbox(); renderThread(true);
    if (window.matchMedia("(min-width: 761px)").matches) $("input").focus();
  }
  function closeChat() {
    current = null;
    $("app").classList.remove("open");
    $("composer").hidden = true; $("modelPill").hidden = true;
    $("chatName").textContent = "เลือกแชททางซ้าย"; $("chatSub").textContent = "";
    $("thread").innerHTML = '<div class="placeholder">เลือกแชทเพื่อเริ่มตอบในนามพู่กัน</div>';
    renderInbox();
  }
  $("back").onclick = closeChat;

  function ding() {
    if (!soundOn || !audioCtx) return;
    var o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime;
    o.type = "sine"; o.frequency.setValueAtTime(880, t); o.frequency.setValueAtTime(1320, t + .09);
    g.gain.setValueAtTime(.15, t); g.gain.exponentialRampToValueAtTime(.001, t + .35);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(t + .36);
  }
  $("soundBtn").onclick = function () {
    soundOn = !soundOn;
    if (soundOn && !audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} }
    this.textContent = soundOn ? "🔔 เสียงเตือนเปิดอยู่" : "🔕 เปิดเสียงเตือน";
    if (soundOn) ding();
  };

  // ---- Google sign-in gate (the database rules decide which account is the admin) ----
  var gate = document.createElement("div");
  gate.style.cssText = "position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:var(--bg);padding:24px";
  gate.innerHTML = '<div style="background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 24px;max-width:340px;text-align:center">' +
    '<b style="font-size:17px">พู่กัน หลังบ้าน</b>' +
    '<p id="gateMsg" style="color:var(--muted);font-size:14px;margin:10px 0 18px">เข้าสู่ระบบด้วยบัญชี Google ของคุณเพื่อดูและตอบแชท</p>' +
    '<button type="button" class="btn" id="gateBtn" style="padding:10px 18px;font-size:14px">เข้าสู่ระบบด้วย Google</button></div>';
  document.body.appendChild(gate);
  function showGate(msg) { if (msg) $("gateMsg").textContent = msg; gate.style.display = "flex"; }
  P.onNeedLogin = function () { showGate(); };
  $("gateBtn").onclick = function () {
    P.loginWithGoogle().then(function () { if (wasDenied) location.reload(); else gate.style.display = "none"; }, function (e) {
      showGate("เข้าสู่ระบบไม่สำเร็จ (" + (e && e.code || "error") + ") ลองอีกครั้ง");
    });
  };
  var wasDenied = false;
  function denied(e) {
    wasDenied = true;
    if (e && /permission/i.test(e.code || e.message || "")) showGate("บัญชี " + (P.currentEmail() || "") + " ไม่มีสิทธิ์เข้าหลังบ้าน ลองเข้าด้วยบัญชีอื่น");
  }

  P.subscribe(function (m, time) {
    if (m.k !== "msg" || seen.has(m.id)) return;
    seen.add(m.id);
    var s = sess(m);
    var t = time || m.ts;
    s.msgs.push({ id: m.id, from: m.from === "b" ? "b" : "u", text: String(m.text || ""), time: t, model: m.model });
    s.msgs.sort(function (a, b) { return a.time - b.time; });
    s.last = Math.max(s.last, t);
    s.first = Math.min(s.first, t);
    if (m.dev) s.dev = m.dev;
    if (m.from === "u") {
      if (m.model) s.model = m.model;
      if (!s.title) s.title = String(m.title || m.text || "").replace(/\s+/g, " ").slice(0, 60);
      var live = t > loadedAt - 2000;
      if (live && (current !== m.sid || document.hidden)) s.unread++;
      if (live) { ding(); if (hiddenChats.delete(m.sid)) P.store("pukan_admin_hidden", Array.from(hiddenChats)); }
    }
    renderInbox();
    if (current === m.sid) renderThread(m.from === "b");
  }, function (on) {
    $("conn").classList.toggle("on", on);
    $("connText").textContent = on ? "ออนไลน์" : "กำลังเชื่อมต่อใหม่";
  }, denied);

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && current) { sessions.get(current).unread = 0; renderInbox(); }
  });
  setInterval(renderInbox, 30000);

  var input = $("input");
  function autosize() {
    input.style.height = "auto";
    var h = input.scrollHeight + 2; // + top/bottom border, so no scrollbar at one line
    input.style.height = Math.min(h, 200) + "px";
    input.style.overflowY = h > 200 ? "auto" : "hidden";
  }

  function reply(text) {
    text = text.trim().slice(0, P.MAX_LEN);
    if (!text || !current) return;
    var s = sessions.get(current);
    var m = { v: 1, k: "msg", sid: current, uid: s.uid, from: "b", id: P.uid(8), text: text, ts: Date.now() };
    $("send").disabled = true;
    $("err").hidden = true;
    P.publish(m).then(function () {
      input.value = ""; autosize(); typingSentFor = null;
    }).catch(function () {
      $("err").textContent = "ส่งไม่สำเร็จ ลองอีกครั้ง";
      $("err").hidden = false;
    }).then(function () { $("send").disabled = !input.value.trim(); });
  }

  // One "typing" event per reply: the visitor sees the thinking dots without spending the daily quota.
  function maybeTyping() {
    if (!current || typingSentFor === current) return;
    typingSentFor = current;
    var s = sessions.get(current);
    P.publish({ v: 1, k: "typing", sid: current, uid: s.uid, from: "b", id: P.uid(8), ts: Date.now() }).catch(function () {});
  }

  input.addEventListener("input", function () { autosize(); $("send").disabled = !input.value.trim(); if (input.value.trim()) maybeTyping(); });
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && window.matchMedia("(hover: hover)").matches) { e.preventDefault(); reply(input.value); }
  });
  $("form").addEventListener("submit", function (e) { e.preventDefault(); reply(input.value); });
  $("quick").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (b) { input.value = b.textContent; autosize(); $("send").disabled = false; input.focus(); }
  });
  autosize();

  // Lock zoom on iPhone: Safari ignores user-scalable=no for pinch, so cancel the gesture itself.
  ["gesturestart", "gesturechange"].forEach(function (ev) {
    document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false });
  });
})();
</script>
</body>
</html>
