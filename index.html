<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>พู่กัน AI</title>
<meta name="description" content="พู่กัน AI ผู้ช่วยอัจฉริยะที่ตอบได้ทุกเรื่อง (มั้ง)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232b3bd1'/%3E%3Cpath d='M44 12c3 0 6 3 5 6L32 38l-6-5 15-19c1-1 2-2 3-2z' fill='%23fff'/%3E%3Cpath d='M24 36l6 5c-1 7-7 11-14 10 3-2 3-5 3-8 0-4 2-6 5-7z' fill='%23ffd166'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Kanit:wght@500;600&display=swap">
<style>
/* Layout: chat-history sidebar on the left, conversation column on the right; the sidebar becomes a drawer on phones. */
:root {
  --bg: #f5f6fa; --side: #eceef5; --surface: #ffffff; --ink: #171a24; --muted: #687089; --line: #e0e3ec;
  --accent: #2b3bd1; --accent-soft: #e4e7fc; --gold: #e9a91c; --user-bubble: #2b3bd1; --user-ink: #ffffff;
  --danger: #c2372f; --shadow: rgba(23, 26, 60, .18);
  --f-body: "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-display: "Kanit", "IBM Plex Sans Thai", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1117; --side: #0a0c11; --surface: #1a1d27; --ink: #e9ebf3; --muted: #8b92a8; --line: #262a36;
    --accent: #8f9bff; --accent-soft: #222848; --gold: #f2c14e; --user-bubble: #3341d6; --user-ink: #ffffff;
    --danger: #ff7b72; --shadow: rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: 16px/1.65 var(--f-body); -webkit-font-smoothing: antialiased;
  display: grid; grid-template-columns: 272px minmax(0, 1fr); overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Sidebar */
.side {
  background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 12px calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
}
.brand { display: flex; align-items: center; gap: 10px; font: 600 20px/1 var(--f-display); padding: 4px 6px 14px; }
.logo { width: 32px; height: 32px; flex: none; }
.close-side { margin-left: auto; display: none; place-items: center; width: 34px; height: 34px; border-radius: 10px; color: var(--muted); }
.new-btn {
  display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px 12px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--line); font-weight: 500;
}
.new-btn:hover { border-color: var(--accent); }
.new-btn .i { width: 18px; height: 18px; }
.list-label { font-size: 12px; color: var(--muted); letter-spacing: .4px; padding: 18px 8px 6px; }
.chatlist { flex: 1; overflow-y: auto; display: grid; align-content: start; gap: 2px; min-height: 0; }
.ci { display: flex; align-items: center; border-radius: 10px; min-width: 0; }
.ci:hover, .ci.active { background: var(--accent-soft); }
.ci .open { flex: 1; min-width: 0; text-align: left; padding: 8px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
.ci .new-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; margin-right: 6px; }
.ci .del { width: 30px; height: 30px; border-radius: 8px; color: var(--muted); opacity: 0; flex: none; margin-right: 4px; display: grid; place-items: center; }
.ci .del .i { width: 16px; height: 16px; }
.ci:hover .del, .ci.active .del, .ci .del:focus-visible { opacity: 1; }
.ci .del:hover { color: var(--danger); }
.empty-list { font-size: 13px; color: var(--muted); padding: 4px 8px; }
.plan { display: flex; align-items: center; gap: 10px; padding: 10px 8px 2px; border-top: 1px solid var(--line); margin-top: 8px; font-size: 13px; }
.plan .me { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font: 600 13px var(--f-display); }
.plan small { display: block; color: var(--muted); font-size: 12px; }
.backdrop { display: none; }

/* Main */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; }
header {
  display: flex; align-items: center; gap: 8px;
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 10px 16px;
}
.icon-btn { width: 40px; height: 40px; border-radius: 12px; display: none; place-items: center; color: var(--ink); }
.icon-btn .i { width: 22px; height: 22px; }
.icon-btn:hover { background: var(--accent-soft); }
.picker { position: relative; }
.picker-btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 10px 7px 12px; border-radius: 12px; font: 600 17px var(--f-display); }
.picker-btn:hover, .picker-btn[aria-expanded="true"] { background: var(--accent-soft); }
.picker-btn .chev { width: 16px; height: 16px; color: var(--muted); transition: transform .15s; }
.picker-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
.menu {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; width: min(340px, calc(100vw - 32px));
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 6px;
  box-shadow: 0 16px 40px -12px var(--shadow);
}
.menu .head { font-size: 12px; color: var(--muted); padding: 8px 12px 4px; }
.opt { display: grid; grid-template-columns: minmax(0, 1fr) 22px; gap: 2px 8px; align-items: center; width: 100%; text-align: left; padding: 10px 12px; border-radius: 12px; }
.opt:hover { background: var(--accent-soft); }
.opt b { font-weight: 600; }
.opt span { grid-column: 1; color: var(--muted); font-size: 13px; }
.opt .check { grid-row: 1 / span 2; grid-column: 2; color: var(--accent); font-weight: 700; visibility: hidden; }
.opt.sel .check { visibility: visible; }
.pro { font-size: 11px; font-weight: 600; color: var(--gold); border: 1px solid currentColor; border-radius: 6px; padding: 0 5px; margin-left: 6px; vertical-align: 2px; }

main { flex: 1; overflow-y: auto; min-height: 0; }
.col { max-width: 760px; margin: 0 auto; padding-block: 16px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.welcome { padding-top: 8vh; text-align: center; display: grid; gap: 14px; justify-items: center; }
.welcome .logo { width: 60px; height: 60px; }
.welcome h1 { font-family: var(--f-display); font-weight: 600; font-size: clamp(24px, 4.5vw, 32px); margin: 0; text-wrap: balance; line-height: 1.3; }
.welcome p { margin: 0; color: var(--muted); max-width: 46ch; }
.chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 620px; margin-top: 18px; }
.chip { text-align: left; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); display: grid; gap: 2px; min-width: 0; }
.chip:hover { border-color: var(--accent); }
.chip strong { font-weight: 600; font-size: 15px; }
.chip span { color: var(--muted); font-size: 13px; }

.msgs { display: grid; gap: 22px; }
.row { display: flex; gap: 12px; align-items: flex-start; min-width: 0; }
.row.u { flex-direction: column; align-items: flex-end; }
.avatar { width: 30px; height: 30px; flex: none; margin-top: 2px; }
.bubble { min-width: 0; overflow-wrap: anywhere; }
.row.u .bubble { background: var(--user-bubble); color: var(--user-ink); padding: 10px 16px; border-radius: 20px 20px 6px 20px; max-width: 80%; white-space: pre-wrap; }
.row.b .bubble { padding-top: 3px; flex: 1; }
.row.u.failed .bubble { opacity: .55; }
.fail { font-size: 12px; color: var(--danger); }
.fail button { color: var(--danger); text-decoration: underline; padding: 0; }
.bubble code { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: .88em; background: var(--accent-soft); padding: 1px 6px; border-radius: 6px; }
.row.b .bubble .gap { height: .7em; }
.row.b .bubble .h { font-family: var(--f-display); font-weight: 600; line-height: 1.35; margin: .5em 0 .25em; }
.row.b .bubble .h1 { font-size: 1.3em; } .row.b .bubble .h2 { font-size: 1.15em; } .row.b .bubble .h3 { font-size: 1.03em; }
.row.b .bubble .h:first-child { margin-top: 0; }
.row.b .bubble .li { display: flex; gap: .55em; padding-left: .2em; margin: .15em 0; }
.row.b .bubble .li > b { color: var(--accent); flex: none; min-width: .8em; font-weight: 600; }
.row.b .bubble .li.ol > b { min-width: 1.2em; }
.row.b .bubble .quote { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--muted); }
.row.b .bubble hr { border: 0; border-top: 1px solid var(--line); margin: .8em 0; }
.codeblock { margin: .6em 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--side); }
.cb-head { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
.cb-head button { font-size: 12px; color: var(--muted); padding: 2px 6px; border-radius: 6px; }
.cb-head button:hover { color: var(--ink); background: var(--accent-soft); }
.codeblock pre { margin: 0; padding: 12px 14px; overflow-x: auto; font-size: 13.5px; line-height: 1.55; }
.codeblock pre code { background: none; padding: 0; font-size: inherit; }
.thought { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.thought svg { width: 15px; height: 15px; color: var(--accent); }
.tools { display: flex; gap: 2px; margin-top: 8px; margin-left: -6px; opacity: 0; animation: fadein .3s ease forwards; }
.tools button { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); }
.tools button svg { width: 17px; height: 17px; }
.tools button:hover { background: var(--accent-soft); color: var(--ink); }
.tools button.on { color: var(--accent); }
.tools button.on svg { fill: currentColor; fill-opacity: .18; }
.cur { display: inline-block; width: .55em; height: .55em; margin-left: 3px; border-radius: 50%; background: var(--ink); vertical-align: middle; animation: pulse 1s ease-in-out infinite; }
.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.toast { position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 8px); z-index: 60; background: var(--ink); color: var(--bg); font-size: 14px; padding: 9px 16px; border-radius: 12px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; width: max-content; max-width: calc(100vw - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.jump { position: absolute; left: 50%; top: -48px; transform: translateX(-50%); width: 36px; height: 36px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; box-shadow: 0 6px 18px -8px var(--shadow); color: var(--ink); }
.jump .i { width: 18px; height: 18px; }
.c-btn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); flex: none; }
.c-btn:hover { background: var(--accent-soft); color: var(--ink); }
@keyframes pulse { 0%, 100% { transform: scale(.75); opacity: .6; } 50% { transform: scale(1); opacity: 1; } }
@keyframes fadein { to { opacity: 1; } }

.thinking { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 15px; padding-top: 4px; font-variant-numeric: tabular-nums; }
.ink { display: inline-flex; gap: 5px; }
.ink i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: drip 1.2s ease-in-out infinite; }
.ink i:nth-child(2) { animation-delay: .15s; }
.ink i:nth-child(3) { animation-delay: .3s; }
.shimmer { background: linear-gradient(90deg, var(--muted) 30%, var(--ink) 50%, var(--muted) 70%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 2s linear infinite; }
@keyframes drip { 0%, 100% { transform: translateY(0); opacity: .35; } 40% { transform: translateY(-5px); opacity: 1; } }
@keyframes shine { to { background-position: -200% 0; } }
@keyframes blink { 50% { opacity: 0; } }

footer {
  position: relative;
  padding-block: 6px calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.composer { max-width: 760px; margin: 0 auto; display: flex; gap: 4px; align-items: flex-end; background: var(--surface); border: 1px solid var(--line); border-radius: 26px; padding: 6px 6px 6px 6px; box-shadow: 0 6px 24px -14px var(--shadow); }
.composer:focus-within { border-color: var(--accent); }
.composer textarea { flex: 1; min-width: 0; border: 0; outline: none; resize: none; background: transparent; color: var(--ink); font: inherit; line-height: 1.5; max-height: 180px; padding: 8px 4px; overflow-y: hidden; }
.composer textarea::placeholder { color: var(--muted); }
.send { width: 36px; height: 36px; margin: 0 0 0 2px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; flex: none; }
.send:disabled { opacity: .35; cursor: default; }
.disclaimer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 8px; }

@media (hover: none) { .ci .del { opacity: .7; } }
@media (max-width: 820px) {
  body { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; inset: 0 auto 0 0; width: min(300px, 86vw); z-index: 50; transform: translateX(-102%); transition: transform .22s ease; box-shadow: 0 0 40px var(--shadow); }
  body.drawer .side { transform: none; }
  body.drawer .backdrop { display: block; position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, .4); }
  .close-side, .icon-btn { display: grid; }
  header { padding-left: max(8px, env(safe-area-inset-left, 0px)); }
  .picker { margin: 0 auto; }
  .menu { left: 50%; transform: translateX(-50%); }
}
@media (max-width: 520px) { .chips { grid-template-columns: minmax(0, 1fr); } .chip:nth-child(n+3) { display: none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="pukan" viewBox="0 0 64 64">
    <rect width="64" height="64" rx="18" fill="var(--accent)"/>
    <path d="M45 11c3.2 0 6.2 3.3 4.8 6.4L32.5 38.2l-6.3-5.1 15.4-19.6c.9-1.2 2-2.5 3.4-2.5z" fill="#fff"/>
    <path d="M25 35.4l6.2 5c-.8 7.4-7.3 11.8-15 10.5 3-2.1 3.3-5 3.3-8 0-4.4 2.5-6.6 5.5-7.5z" fill="var(--gold)"/>

  <symbol id="i-down" viewBox="0 0 24 24"><path d="M17 14V4h3v10zM17 14l-4 7a2.6 2.6 0 0 1-3-2.6V15H5a2 2 0 0 1-2-2.3l1.3-7A2 2 0 0 1 6.3 4H17"/></symbol>

  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></symbol>
</svg>

<aside class="side" id="side">
  <div class="brand"><svg class="logo"><use href="#pukan"/></svg>พู่กัน AI<button class="close-side" id="closeSide" type="button" aria-label="ปิดเมนู"><svg class="i" aria-hidden="true"><use href="#i-close"/></svg></button></div>
  <button class="new-btn" id="newChat" type="button"><svg class="i" aria-hidden="true"><use href="#i-newchat"/></svg> แชทใหม่</button>
  <div class="list-label">ประวัติแชท</div>
  <nav class="chatlist" id="chatlist" aria-label="ประวัติแชท"></nav>
  <div class="plan"><div class="me" id="meAv">?</div><div>ผู้ใช้ทั่วไป<small>แพ็กเกจฟรี · ข้อความไม่จำกัด</small></div></div>
</aside>
<div class="backdrop" id="backdrop"></div>

<div class="main">
  <header>
    <button class="icon-btn" id="openSide" type="button" aria-label="เปิดประวัติแชท"><svg class="i" aria-hidden="true"><use href="#i-menu"/></svg></button>
    <div class="picker">
      <button class="picker-btn" id="pickerBtn" type="button" aria-haspopup="true" aria-expanded="false"><span id="modelName">พู่กัน 4.5 Ultra</span><svg class="i chev" aria-hidden="true"><use href="#i-chev"/></svg></button>
      <div class="menu" id="menu" role="menu" hidden></div>
    </div>
    <button class="icon-btn" id="newChat2" type="button" aria-label="แชทใหม่"><svg class="i" aria-hidden="true"><use href="#i-newchat"/></svg></button>
  </header>

  <main id="scroller">
    <div class="col">
      <section class="welcome" id="welcome">
        <svg class="logo"><use href="#pukan"/></svg>
        <h1>สวัสดีครับ วันนี้ให้พู่กันช่วยอะไรดี?</h1>
        <p>ถามได้ทุกเรื่อง ตั้งแต่การบ้าน สูตรอาหาร ไปจนถึงความหมายของชีวิต</p>
        <div class="chips" id="chips">
          <button class="chip" type="button" data-q="ช่วยแต่งกลอนรักสั้นๆ ให้หน่อย"><strong>แต่งกลอนรัก</strong><span>สั้นๆ เอาไปส่งให้คนพิเศษ</span></button>
          <button class="chip" type="button" data-q="เที่ยงนี้กินอะไรดี"><strong>เที่ยงนี้กินอะไรดี</strong><span>คำถามที่ยากที่สุดของมนุษยชาติ</span></button>

// ---- Firebase plumbing ----

// waits for a Google sign-in; the database rules decide which Google account is the admin.
(function (P) {
  firebase.initializeApp(P.FIREBASE);
  var auth = firebase.auth(), db = firebase.database();
  var TS = firebase.database.ServerValue.TIMESTAMP;
  P.role = document.body.dataset.role === "admin" ? "admin" : "visitor";

  var resolveUser;
  P.ready = new Promise(function (r) { resolveUser = r; });
  auth.onAuthStateChanged(function (user) {
    if (P.role === "visitor") {
      if (user) resolveUser(user);
      else auth.signInAnonymously().catch(function (e) { console.error("anonymous sign-in failed", e); });
    } else if (user && !user.isAnonymous) {
      resolveUser(user);
    } else if (P.onNeedLogin) {
      P.onNeedLogin();
    }
  });
  // The popup must open straight from the tap (no await before it), or Safari blocks it.
  P.loginWithGoogle = function () {
    var provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });
    return auth.signInWithPopup(provider);
  };
  P.currentEmail = function () { return auth.currentUser && auth.currentUser.email; };

  // Drop undefined fields (the database rejects them).
  function clean(o) { return JSON.parse(JSON.stringify(o)); }

  P.publish = function (msg) {
    return P.ready.then(function (user) {
      if (msg.k === "typing") return db.ref("typing/" + msg.sid).set(TS);
      var meta = msg.from === "u"
        ? clean({ owner: user.uid, uid: msg.uid, title: msg.title, dev: msg.dev, model: msg.model, updated: TS })
        : { updated: TS };
      // Chat info first: the rules check the chat's owner before accepting a message in it.
      return db.ref("meta/" + msg.sid).update(meta).then(function () {
        var m = clean(msg); m.t = TS;
        return db.ref("msgs/" + msg.sid + "/" + msg.id).set(m);
      });
    });
  };

  // Calls onMsg(message, serverTimeMs) for every message in the chats this page may see:
  // a visitor's own chats, or (admin) the 150 most recently active chats.
  // Bot "typing" signals arrive as { k: "typing" } messages.
  P.subscribe = function (onMsg, onState, onError) {
    var watched = {};
    function fail(e) { console.error(e); if (onError) onError(e); }
    function watch(sid) {
      if (watched[sid]) return;
      watched[sid] = true;
      db.ref("msgs/" + sid).orderByChild("t").limitToLast(200).on("child_added", function (snap) {
        var m = snap.val();
        if (!m || m.v !== 1 || !m.id) return;
        m.sid = sid;
        onMsg(m, m.t || m.ts || Date.now());
      }, fail);
      if (P.role === "visitor") {
        db.ref("typing/" + sid).on("value", function (snap) {
          var t = snap.val();
          if (t) onMsg({ v: 1, k: "typing", sid: sid, from: "b", id: "typing-" + t }, t);

    P.ready.then(function (user) {
      db.ref(".info/connected").on("value", function (s) { onState && onState(s.val() === true); });
      var q = P.role === "admin"
        ? db.ref("meta").orderByChild("updated").limitToLast(150)
        : db.ref("meta").orderByChild("owner").equalTo(user.uid);
      q.on("child_added", function (snap) { watch(snap.key); }, fail);
    });
  };

  // Alert in the owner's Discord. Sent as a form so the browser needs no CORS answer from Discord.
  // Best effort: a failed alert never blocks the chat.
  P.notify = function (title, text) {
    if (!/^https:\/\/(\w+\.)?discord(app)?\.com\/api\/webhooks\//.test(P.DISCORD_WEBHOOK || "")) return;
    var form = new FormData();
    form.append("payload_json", JSON.stringify({
      username: "พู่กัน หลังบ้าน",
      embeds: [{ title: title.slice(0, 250), description: text.slice(0, 4000), color: 0x2b3bd1, timestamp: new Date().toISOString() }],
      allowed_mentions: { parse: [] }
    }));
    fetch(P.DISCORD_WEBHOOK, { method: "POST", body: form, mode: "no-cors" }).catch(function () {});
  };
})(window.PUKAN);

window.PUKAN.uid = function (n) {
  var a = new Uint8Array(n || 8);
  crypto.getRandomValues(a);
  return Array.from(a, function (b) { return b.toString(16).padStart(2, "0"); }).join("");
};

window.PUKAN.esc = function (s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
};

// Markdown-ish formatter for bot answers: # headings, **bold**, *italic*, `code`, ```code blocks```,
// "- " bullets, "1. " numbered lists, "> " quotes and "---" rules. Escapes first, so it is safe for any text.
window.PUKAN.fmt = function (s) {
  var esc = window.PUKAN.esc;
  function inline(t) {
    return esc(t)
      .replace(/`([^`\n]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*\s][^*\n]*)\*/g, "$1<em>$2</em>");
  }
  return String(s).split("```").map(function (part, i) {
    if (i % 2) {
      var nl = part.indexOf("\n"), lang = nl < 0 ? "" : part.slice(0, nl).trim(), code = nl < 0 ? part : part.slice(nl + 1);
      return '<div class="codeblock"><div class="cb-head"><span>' + esc(lang || "code") + '</span><button type="button" class="cb-copy">คัดลอกโค้ด</button></div><pre><code>' + esc(code.replace(/\n$/, "")) + "</code></pre></div>";
    }
    return part.replace(/^\n|\n$/g, "").split("\n").map(function (line) {
      var m;
      if (!line.trim()) return '<div class="gap"></div>';
      if ((m = /^(#{1,3})\s+(.*)$/.exec(line))) return '<div class="h h' + m[1].length + '">' + inline(m[2]) + "</div>";
      if (/^(-{3,}|_{3,})$/.test(line.trim())) return "<hr>";
      if ((m = /^\s*(\d+)[.)]\s+(.*)$/.exec(line))) return '<div class="li ol"><b>' + m[1] + '.</b><span>' + inline(m[2]) + "</span></div>";
      if ((m = /^\s*[-•*]\s+(.*)$/.exec(line))) return '<div class="li"><b>•</b><span>' + inline(m[1]) + "</span></div>";
      if ((m = /^>\s?(.*)$/.exec(line))) return '<div class="quote">' + inline(m[1]) + "</div>";
      return "<div>" + inline(line) + "</div>";
    }).join("");
  }).join("");
};

window.PUKAN.store = function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} };
window.PUKAN.load = function (k) { try { return JSON.parse(localStorage.getItem(k)); } catch (_) { return null; } };
</script>
<script>
(function () {
  var P = window.PUKAN;
  var $ = function (id) { return document.getElementById(id); };
  var msgsEl = $("msgs"), input = $("input"), sendBtn = $("send"), scroller = $("scroller");
  var pageStart = Date.now();
  var device = /Mobi|Android|iPhone/i.test(navigator.userAgent) ? "มือถือ" : "คอม";

  // ---- identity, chats and history (kept in this browser) ----

  if (!me) { me = P.uid(6); P.store("pukan_uid", me); }
  $("meAv").textContent = me.slice(0, 1).toUpperCase();

  var chats = P.load("pukan_chats") || [];
  var legacy = P.load("pukan_sid");
  if (!chats.length && legacy) {
    var lh = P.load("pukan_hist_" + legacy) || [];
    var firstU = lh.filter(function (m) { return m.from === "u"; })[0];
    if (firstU) chats.push({ sid: legacy, title: firstU.text.slice(0, 48), updated: lh[lh.length - 1].ts || Date.now() });
  }
  var deleted = P.load("pukan_deleted") || [];
  var histCache = {};
  var seen = new Set();
  chats.forEach(function (c) { getHist(c.sid).forEach(function (m) { seen.add(m.id); }); });

  var model = P.model(P.load("pukan_model"));
  function ICON(n) { return '<svg class="i" aria-hidden="true"><use href="#i-' + n + '"/></svg>'; }
  var toastTimer = null;
  function toast(t) {
    var el = $("toast");
    el.textContent = t; el.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2200);
  }
  var cur = null, thinkingEl = null, thinkTick = null, showTimer = null;
  var typingUntil = {};

  function getHist(sid) {
    if (!histCache[sid]) histCache[sid] = P.load("pukan_hist_" + sid) || [];
    return histCache[sid];
  }
  function saveHist(sid) { P.store("pukan_hist_" + sid, getHist(sid).slice(-200)); }
  function saveChats() { chats.sort(function (a, b) { return b.updated - a.updated; }); chats = chats.slice(0, 40); P.store("pukan_chats", chats); }
  function chatOf(sid) { for (var i = 0; i < chats.length; i++) if (chats[i].sid === sid) return chats[i]; return null; }
  function scrollDown() { scroller.scrollTop = scroller.scrollHeight; }
  function nearBottom() { return scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 140; }
  function lastUser(h) { for (var i = h.length - 1; i >= 0; i--) if (h[i].from === "u") return h[i]; return null; }

  // ---- sidebar ----
  function renderList() {
    var el = $("chatlist");
    el.innerHTML = "";
    if (!chats.length) { el.innerHTML = '<div class="empty-list">ยังไม่มีแชท เริ่มถามอะไรสักอย่างได้เลย</div>'; return; }
    chats.forEach(function (c) {
      var row = document.createElement("div");
      row.className = "ci" + (c.sid === cur ? " active" : "");
      var open = document.createElement("button");
      open.type = "button"; open.className = "open"; open.textContent = c.title; open.title = c.title;
      open.onclick = function () { openChat(c.sid); };
      row.appendChild(open);
      if (c.unread) { var d = document.createElement("span"); d.className = "new-dot"; d.title = "มีคำตอบใหม่"; row.appendChild(d); }
      var del = document.createElement("button");
      del.type = "button"; del.className = "del"; del.innerHTML = ICON("trash"); del.setAttribute("aria-label", "ลบแชท " + c.title);
      del.onclick = function () { removeChat(c.sid); };
      row.appendChild(del);
      el.appendChild(row);
    });
  }
  function removeChat(sid) {
    deleted.push(sid); P.store("pukan_deleted", deleted.slice(-100));
    chats = chats.filter(function (c) { return c.sid !== sid; });
    try { localStorage.removeItem("pukan_hist_" + sid); } catch (_) {}
    delete histCache[sid];
    saveChats();
    if (sid === cur) newChat(); else renderList();
  }
  function setDrawer(open) { document.body.classList.toggle("drawer", open); }
  $("openSide").onclick = function () { setDrawer(true); };
  $("closeSide").onclick = $("backdrop").onclick = function () { setDrawer(false); };

  // ---- model picker ----
  function renderMenu() {
    var m = $("menu");
    m.innerHTML = '<div class="head">เลือกโมเดล</div>';
    P.MODELS.forEach(function (x) {
      var b = document.createElement("button");
      b.type = "button"; b.setAttribute("role", "menuitemradio"); b.setAttribute("aria-checked", x.id === model.id);
      b.className = "opt" + (x.id === model.id ? " sel" : "");
      b.innerHTML = "<b>" + P.esc(x.name) + (x.id === "think" ? '<span class="pro">ใหม่</span>' : "") + "</b><i class=\"check\">✓</i><span>" + P.esc(x.desc) + "</span>";
      b.onclick = function () { model = x; P.store("pukan_model", x.id); $("modelName").textContent = x.name; toggleMenu(false); input.focus(); };
      m.appendChild(b);
    });
  }
  function toggleMenu(open) {
    if (open) renderMenu();
    $("menu").hidden = !open;
    $("pickerBtn").setAttribute("aria-expanded", open);
  }
  $("pickerBtn").onclick = function (e) { e.stopPropagation(); toggleMenu($("menu").hidden); };
  document.addEventListener("click", function (e) { if (!e.target.closest(".picker")) toggleMenu(false); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { toggleMenu(false); setDrawer(false); } });
  $("modelName").textContent = model.name;

  // ---- conversation ----
  function openChat(sid) {
    cur = sid;
    P.store("pukan_cur", sid);
    var c = chatOf(sid);
    if (c && c.unread) { c.unread = false; saveChats(); }
    msgsEl.innerHTML = ""; thinkingEl = null; stopTick();
    var h = getHist(sid);
    h.forEach(function (m) { render(m, false); });
    $("welcome").hidden = h.length > 0;
    refreshThinking();
    renderList();
    setDrawer(false);
    scrollDown();
  }
  function newChat() {
    var sid = P.uid(6);
    openChat(sid);
    input.focus();
  }

  function render(m, animate) {
    var row = document.createElement("div");
    row.className = "row " + (m.from === "u" ? "u" : "b");
    if (m.from === "u") {
      var b = document.createElement("div");
      b.className = "bubble"; b.textContent = m.text;
      row.appendChild(b);
      if (m.failed) markFailed(row, m);
    } else {
      row.innerHTML = '<svg class="avatar"><use href="#pukan"/></svg><div class="bubble"></div>';
      var bub = row.querySelector(".bubble");
      if (m.thought) {
        var t = document.createElement("div");
        t.className = "thought"; t.innerHTML = ICON("spark") + "คิดเป็นเวลา " + fmtSecs(m.thought);
        bub.appendChild(t);
      }
      var txt = document.createElement("div");
      bub.appendChild(txt);
      if (animate) typeOut(txt, m.text, bub, P.model(m.model).speed); else { txt.innerHTML = P.fmt(m.text); addTools(bub, m.text); }
    }
    msgsEl.insertBefore(row, thinkingEl);
    scrollDown();
    return row;
  }
  function fmtSecs(s) { return s < 60 ? s + " วินาที" : Math.floor(s / 60) + " นาที " + (s % 60) + " วินาที"; }

  function addTools(bub, text) {
    var tools = document.createElement("div");
    tools.className = "tools";
    tools.innerHTML =
      '<button type="button" data-t="copy" aria-label="คัดลอก" title="คัดลอก">' + ICON("copy") + '</button>' +
      '<button type="button" data-t="up" aria-label="คำตอบดี" title="คำตอบดี">' + ICON("up") + '</button>' +
      '<button type="button" data-t="down" aria-label="คำตอบไม่ดี" title="คำตอบไม่ดี">' + ICON("down") + '</button>' +
      '<button type="button" data-t="speak" aria-label="อ่านออกเสียง" title="อ่านออกเสียง">' + ICON("speak") + '</button>' +
      '<button type="button" data-t="retry" aria-label="สร้างคำตอบใหม่" title="สร้างคำตอบใหม่">' + ICON("retry") + '</button>';
    tools.onclick = function (e) {
      var b = e.target.closest("button"); if (!b) return;
      var t = b.dataset.t;
      if (t === "copy") {
        if (!navigator.clipboard) return;
        navigator.clipboard.writeText(text).then(function () {
          b.innerHTML = ICON("check"); toast("คัดลอกแล้ว");
          setTimeout(function () { b.innerHTML = ICON("copy"); }, 1500);
        }, function () {});
      } else if (t === "up" || t === "down") {
        var other = tools.querySelector('[data-t="' + (t === "up" ? "down" : "up") + '"]');
        other.classList.remove("on");
        if (b.classList.toggle("on")) toast(t === "up" ? "ขอบคุณสำหรับความคิดเห็น 🙏" : "ขอบคุณครับ พู่กันจะนำไปปรับปรุง");
      } else if (t === "speak") {
        if (!window.speechSynthesis) { toast("เบราว์เซอร์นี้อ่านออกเสียงไม่ได้"); return; }
        if (b.classList.contains("on")) { speechSynthesis.cancel(); return; }
        speechSynthesis.cancel();
        document.querySelectorAll('.tools [data-t="speak"].on').forEach(function (x) { x.classList.remove("on"); x.innerHTML = ICON("speak"); });
        var u = new SpeechSynthesisUtterance(text.replace(/[`*#>]/g, ""));
        u.lang = "th-TH";
        u.onend = u.onerror = function () { b.classList.remove("on"); b.innerHTML = ICON("speak"); };
        b.classList.add("on"); b.innerHTML = ICON("stop");
        speechSynthesis.speak(u);
      } else if (t === "retry") {
        toast("ขณะนี้มีผู้ใช้งานจำนวนมาก โปรดลองใหม่ภายหลัง");
      }
    };
    bub.appendChild(tools);
  }

  // Fake token streaming so a hand-typed answer looks generated: word-sized chunks, small pauses at punctuation.
  function typeOut(el, text, bub, speed) {
    var chars = Array.from(text), i = 0;
    (function step() {
      i = Math.min(chars.length, i + Math.ceil((2 + Math.random() * 4) * speed));
      el.innerHTML = P.fmt(chars.slice(0, i).join(""));
      if (i < chars.length) {
        var last = el.lastElementChild;
        if (last && last.classList.contains("codeblock")) last = last.querySelector("code");
        else if (last && last.lastElementChild && last.classList.contains("li")) last = last.lastElementChild;
        (last || el).insertAdjacentHTML("beforeend", '<span class="cur"></span>');
        var pause = /[.!?\n:,ๆ]/.test(chars[i - 1]) ? 90 + Math.random() * 160 : 0;
        if (nearBottom()) scrollDown();
        setTimeout(step, pause + (18 + Math.random() * 40) / Math.max(1, speed / 1.5));
      } else { addTools(bub, text); if (nearBottom()) scrollDown(); }
    })();
  }

  function markFailed(row, m) {
    var f = document.createElement("div");
    f.className = "fail";
    f.innerHTML = 'ส่งไม่สำเร็จ <button type="button">ลองส่งอีกครั้ง</button>';
    row.classList.add("failed");
    row.appendChild(f);
    f.querySelector("button").onclick = function () {
      row.remove();
      var h = getHist(m.sid);
      h.splice(h.indexOf(m), 1);
      saveHist(m.sid);
      seen.delete(m.id);
      send(m.text);
    };
  }

  // ---- "thinking" indicator ----
  function waiting() {
    var h = getHist(cur), last = h[h.length - 1];
    return !!(last && last.from === "u" && !last.failed);
  }
  function stopTick() { clearInterval(thinkTick); thinkTick = null; }
  function thinkingText() {
    var lu = lastUser(getHist(cur));
    var mid = lu ? lu.model : model.id;
    var secs = lu ? Math.max(0, Math.round((Date.now() - lu.ts) / 1000)) : 0;
    if (mid === "think") return "กำลังคิดอย่างละเอียด · " + secs + " วิ";
    if (secs > 40) return "พู่กันกำลังคิดหนักมาก ขอจุ่มหมึกเพิ่มแป๊บ...";
    return mid === "flash" ? "กำลังพิมพ์..." : "พู่กันกำลังคิด...";
  }
  function showThinking() {
    if (!thinkingEl) {
      thinkingEl = document.createElement("div");
      thinkingEl.className = "row b";
      thinkingEl.innerHTML = '<svg class="avatar"><use href="#pukan"/></svg><div class="thinking"><span class="ink"><i></i><i></i><i></i></span><span class="shimmer"></span></div>';
      msgsEl.appendChild(thinkingEl);
      scrollDown();
    }
    thinkingEl.querySelector(".shimmer").textContent = thinkingText();
    if (!thinkTick) thinkTick = setInterval(function () { if (thinkingEl) thinkingEl.querySelector(".shimmer").textContent = thinkingText(); }, 1000);
  }
  function hideThinking() { stopTick(); if (thinkingEl) { thinkingEl.remove(); thinkingEl = null; } }
  function refreshThinking() {
    if (waiting() || Date.now() < (typingUntil[cur] || 0)) showThinking(); else hideThinking();
  }

  // ---- sending and receiving ----
  function send(text) {
    text = text.trim().slice(0, P.MAX_LEN);
    if (!text) return;
    $("welcome").hidden = true;
    var c = chatOf(cur);
    if (!c) { c = { sid: cur, title: text.replace(/\s+/g, " ").slice(0, 48), updated: Date.now() }; chats.push(c); }
    c.updated = Date.now(); saveChats(); renderList();
    var m = { v: 1, k: "msg", sid: cur, uid: me, from: "u", id: P.uid(8), text: text, ts: Date.now(), dev: device, model: model.id, title: c.title };
    seen.add(m.id);
    getHist(cur).push(m); saveHist(cur);
    var row = render(m, false);
    clearTimeout(showTimer);
    showTimer = setTimeout(refreshThinking, 600);
    P.publish(m).then(function () {
      P.notify("💬 มีคนทัก (" + device + " · " + model.name + ")", text);
    }).catch(function () {
      m.failed = true; saveHist(m.sid);
      if (m.sid === cur) { refreshThinking(); markFailed(row, m); }
    });
  }

  P.subscribe(function (m, serverTime) {
    var c = chatOf(m.sid);
    if ((!c && m.uid !== me) || deleted.indexOf(m.sid) !== -1) return;
    if (m.k === "typing" && m.from === "b") {
      if (Date.now() - serverTime < 20000) {
        typingUntil[m.sid] = Date.now() + 20000;
        if (m.sid === cur) { refreshThinking(); setTimeout(refreshThinking, 20100); }
      }
      return;
    }
    if (m.k !== "msg" || seen.has(m.id)) return;
    seen.add(m.id);
    var h = getHist(m.sid);
    if (m.from === "b") {
      var lu = lastUser(h);
      m.model = lu ? lu.model : "ultra";
      if (m.model === "think" && lu) m.thought = Math.max(2, Math.round(((serverTime || Date.now()) - lu.ts) / 1000));
      m.ts = serverTime || Date.now();
    }
    h.push(m); saveHist(m.sid);
    if (!c) { c = { sid: m.sid, title: (m.title || m.text || "แชท").slice(0, 48), updated: m.ts }; chats.push(c); }
    c.updated = Math.max(c.updated, m.ts || 0);
    if (m.sid === cur) {
      $("welcome").hidden = true;
      if (m.from === "b") { typingUntil[cur] = 0; hideThinking(); render(m, serverTime > pageStart - 3000); }
      else render(m, false);
    } else if (m.from === "b") {
      c.unread = true;
    }
    saveChats(); renderList();
  });

  // ---- composer ----
  function autosize() {
    input.style.height = "auto";
    var h = input.scrollHeight;
    input.style.height = Math.min(h, 180) + "px";
    input.style.overflowY = h > 180 ? "auto" : "hidden";
  }
  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    send(input.value);
    input.value = ""; autosize(); sendBtn.disabled = true;
  });
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && window.matchMedia("(hover: hover)").matches) { e.preventDefault(); $("form").requestSubmit(); }
  });
  input.addEventListener("input", function () { autosize(); sendBtn.disabled = !input.value.trim(); });
  $("chips").addEventListener("click", function (e) { var c = e.target.closest(".chip"); if (c) send(c.dataset.q); });
  $("newChat").onclick = $("newChat2").onclick = newChat;

  // ---- small realistic touches ----
  scroller.addEventListener("scroll", function () { $("jump").hidden = nearBottom(); }, { passive: true });
  $("jump").onclick = function () { scroller.scrollTo({ top: scroller.scrollHeight, behavior: "smooth" }); };
  $("attach").onclick = function () { toast("การแนบไฟล์ใช้ได้เฉพาะแพ็กเกจ Pro"); };
  $("mic").onclick = function () { toast("โหมดเสียงกำลังจะมาเร็วๆ นี้"); };
  msgsEl.addEventListener("click", function (e) {
    var b = e.target.closest(".cb-copy"); if (!b || !navigator.clipboard) return;
    navigator.clipboard.writeText(b.closest(".codeblock").querySelector("code").textContent).then(function () {
      b.textContent = "คัดลอกแล้ว ✓"; setTimeout(function () { b.textContent = "คัดลอกโค้ด"; }, 1500);
    }, function () {});
  });

  saveChats();
  var startSid = P.load("pukan_cur");
  window.addEventListener("pagehide", function () { P.store("pukan_cur", chatOf(cur) ? cur : null); });
  if (startSid && chatOf(startSid)) openChat(startSid); else openChat(P.uid(6));
})();
</script>
</body>
</html>
